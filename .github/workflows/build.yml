# Builds the meow images so they can be downloaded and flashed.
#   meow-usb.img  raw disk image for a USB stick (old legacy-BIOS PCs)
#   meow.iso      the original CD image
# Download them from the run's "Artifacts" section (they arrive zipped).
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm xorriso gcc-multilib qemu-system-x86

      - name: build meow.iso
        run: make

      - name: build meow-usb.img
        run: make usb

      - name: check the image
        run: |
          test "$(stat -c %s build/meow-usb.img)" -eq 1048576
          # boot signature 55 AA at offset 510
          test "$(od -An -tx1 -j510 -N2 build/meow-usb.img | tr -d ' ')" = 55aa
          # no instructions newer than a 486 in the USB kernel
          ! objdump -d build/usb/kernel.elf | grep -qiE 'cmov|cpuid|xmm|rdtsc'

      - name: boot it as a 486 (hard disk, USB stick, floppy)
        run: |
          boot() {
            name=$1; shift
            timeout 20 qemu-system-i386 -cpu 486 -m 32 -display none \
              -serial file:$name.log "$@" || true
            grep -a "welcome to meow" $name.log
          }
          img=build/meow-usb.img
          boot hd  -drive file=$img,format=raw
          boot usb -usb -drive if=none,id=stick,file=$img,format=raw \
                   -device usb-storage,drive=stick,bootindex=0
          boot fda -fda $img

      - name: checksums
        run: cd build && sha256sum meow-usb.img meow.iso | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: meow-usb
          path: |
            build/meow-usb.img
            build/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: meow-iso
          path: build/meow.iso
